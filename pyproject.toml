[project]
name = "fgo-ocr"
version = "0.1.0"
description = "CPU OCR for Fate/Grand Order UI (closed vocabulary)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26.0",
  "Pillow>=10.0.0",
  "onnxruntime>=1.17.0",
]

[project.scripts]
fgo-ocr = "fgo_ocr.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fgo_ocr*"]